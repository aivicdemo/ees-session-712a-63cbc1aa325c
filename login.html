<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新EES - ログイン画面</title>
  <style>
    :root {
      /* Primary & Interaction */
      --primary: #2563eb;
      --primary-hover: #1d4ed8;

      /* Background Layers */
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --bg-sidebar: #f1f5f9;

      /* Borders & Dividers */
      --border: #e2e8f0;
      --border-width: 1px;

      /* Text */
      --text: #1e293b;
      --text-muted: #64748b;

      /* Top Bar */
      --top-bar-bg: #1e293b;
      --top-bar-border: #0f172a;
      --top-bar-text: #f1f5f9;

      /* Typography */
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;

      /* Spacing & Sizing */
      --space-unit: 8px;
      --control-height: 36px;
      --radius-card: 6px;
      --radius-control: 4px;

      /* Shadows */
      --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);

      /* Motion */
      --motion-duration: 200ms;

      /* Surface Texture */
      --surface-texture: linear-gradient(135deg, rgba(226, 232, 240, 0.3) 0%, rgba(226, 232, 240, 0) 100%);
      --surface-texture-size: 100% 100%;
      --surface-texture-position: 0 0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: var(--font-family);
      background-color: var(--bg-main);
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: calc(var(--space-unit) * 2);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background-color: var(--bg-card);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-card);
      padding: calc(var(--space-unit) * 6);
      box-shadow: var(--shadow-card);
      background-image: var(--surface-texture);
      background-size: var(--surface-texture-size);
      background-position: var(--surface-texture-position);
    }

    .login-header {
      margin-bottom: calc(var(--space-unit) * 4);
      text-align: center;
    }

    .login-logo {
      display: inline-block;
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      border-radius: calc(var(--radius-control) * 2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 24px;
      margin-bottom: calc(var(--space-unit) * 2);
    }

    .login-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: calc(var(--space-unit) * 1);
      letter-spacing: -0.5px;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: calc(var(--space-unit) * 3);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: calc(var(--space-unit) * 1.5);
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      height: var(--control-height);
      padding: 0 calc(var(--space-unit) * 2);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-control);
      background-color: var(--bg-card);
      color: var(--text);
      font-size: 14px;
      font-family: var(--font-family);
      transition: all var(--motion-duration) ease;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      background-color: var(--bg-card);
    }

    .form-input::placeholder {
      color: var(--text-muted);
    }

    .login-button {
      height: var(--control-height);
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-control);
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font-family);
      cursor: pointer;
      transition: all var(--motion-duration) ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: calc(var(--space-unit) * 1);
    }

    .login-button:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .login-button:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.2);
    }

    .login-footer {
      margin-top: calc(var(--space-unit) * 4);
      padding-top: calc(var(--space-unit) * 3);
      border-top: var(--border-width) solid var(--border);
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: calc(var(--space-unit) * 4);
      }

      .login-title {
        font-size: 24px;
      }

      .login-container {
        max-width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .form-input,
      .login-button {
        transition: none;
      }

      .login-button:hover {
        transform: none;
      }

      .login-button:active {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">新</div>
        <h1 class="login-title" data-testid="login-title">新EES</h1>
        <p class="login-subtitle">販売・仕入統合管理システム</p>
      </div>

      <form class="login-form" data-testid="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">ユーザー名</label>
          <input
            class="form-input"
            type="text"
            id="username"
            name="username"
            data-testid="username"
            placeholder="ユーザー名を入力"
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">パスワード</label>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            data-testid="password"
            placeholder="パスワードを入力"
            autocomplete="current-password"
          >
        </div>

        <button class="login-button" type="submit" data-testid="login-button">
          ログイン
        </button>
      </form>

      <div class="login-footer">
        <p>サンプル実装ではどの入力でもログインできます</p>
      </div>
    </div>
  </div>

  <script>
    document.querySelector('[data-testid="login-form"]').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = './index.html';
    });
  </script>
</body>
</html>
